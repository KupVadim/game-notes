name: Process INBOX Files

on:
  push:
    branches:
      - main
    paths:
      - 'docs/INBOX/**'
      - '.github/workflows/process-inbox.yml'

permissions:
  contents: write
  issues: write

jobs:
  detect-inbox:
    runs-on: ubuntu-latest
    outputs:
      has_files: ${{ steps.check_files.outputs.has_files }}
      file_list: ${{ steps.check_files.outputs.file_list }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for INBOX files
        id: check_files
        run: |
          FILES=$(find docs/INBOX -type f -name '*.md' ! -name 'README.md' -printf '%f\n' | sort)
          FILE_COUNT=$(echo "$FILES" | grep -c . || true)
          
          if [ $FILE_COUNT -gt 0 ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
            # Format file list for issue body
            FILE_LIST=$(echo "$FILES" | sed 's/^/- /')
            FILE_LIST="${FILE_LIST//$'\n'/\\n}"
            echo "file_list=$FILE_LIST" >> $GITHUB_OUTPUT
            echo "Found $FILE_COUNT files in INBOX"
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No files in INBOX"
          fi

  create-agent-issue:
    needs: detect-inbox
    if: needs.detect-inbox.outputs.has_files == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create or update agent task issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE_TITLE="[Agent Task] Process INBOX Files"
          ISSUE_BODY=$(cat <<'EOF'
          ## Task: Process and Move INBOX Files
          
          The following files in `docs/INBOX/` need to be processed and moved to their proper location:
          
          ${{ needs.detect-inbox.outputs.file_list }}
          
          ### Agent Processing Checklist
          
          For each file:
          1. **Validate MkDocs Format**
             - Headers use `##` or `###` (not `#` at top)
             - Video embeds use responsive HTML iframe format
             - Admonitions properly formatted with `!!!` syntax
             - Russian language throughout
             - Code blocks have language tags
          
          2. **Enhance with MkDocs Features**
             - Add `!!! info "Источник"` for source attribution
             - Use `!!! note`, `!!! warning`, `!!! tip` for important sections
             - Add line numbers: ` ```python linenums="1" `
             - Use collapsible sections: `??? note "Title"`
          
          3. **Determine Destination**
             - Files about Assetto Corsa Rally → `docs/Games/Assetto Corsa Rally/{FileName}.md`
             - Use filename: `Game_Topic_Description.md` (CamelCase_with_underscores)
          
          4. **Move & Commit**
             - Move file to correct location
             - Delete from INBOX
             - Commit: `Process INBOX: Move {file} → Games/{GameName}/{file}`
          
          5. **Validate Before Commit**
             - Run: `mkdocs build --strict`
             - Verify no errors
          
          See `.github/copilot-instructions.md` for detailed guidelines.
          
          ---
          **Auto-generated by INBOX processing workflow**
          EOF
          )
          
          # Check if issue already exists
          EXISTING=$(gh issue list --label "agent-task" --state open --json number | jq -r '.[0].number // empty')
          
          if [ -n "$EXISTING" ]; then
            echo "Updating existing issue #$EXISTING"
            gh issue edit $EXISTING --body "$ISSUE_BODY"
          else
            echo "Creating new issue"
            gh issue create --title "$ISSUE_TITLE" --body "$ISSUE_BODY" --label "agent-task"
          fi
          fi
