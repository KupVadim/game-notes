name: Process INBOX Files

on:
  push:
    branches:
      - main
    paths:
      - 'docs/INBOX/**'
      - '.github/workflows/process-inbox.yml'

permissions:
  contents: write

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Find and process INBOX files
        run: |
          #!/bin/bash
          set -e
          
          # Find INBOX files (excluding README)
          INBOX_FILES=$(find docs/INBOX -type f -name '*.md' ! -name 'README.md' | sort)
          FILE_COUNT=$(echo "$INBOX_FILES" | grep -c . || true)
          
          if [ $FILE_COUNT -eq 0 ]; then
            echo "No files to process"
            exit 0
          fi
          
          echo "Processing $FILE_COUNT files..."
          
          # Create games directory
          mkdir -p "docs/Games/Assetto Corsa Rally"
          
          # Process each file
          echo "$INBOX_FILES" | while read inbox_file; do
            filename=$(basename "$inbox_file")
            
            # Determine if it's Assetto Corsa Rally content
            if [[ $filename == *"Assetto"* ]] || [[ $filename == *"Rally"* ]] || [[ $filename == *"Performance"* ]] || [[ $filename == *"VR"* ]]; then
              game="Assetto Corsa Rally"
              base_name="${filename%.md}"
              
              # Add game prefix if not present
              if [[ ! $base_name =~ ^Assetto ]]; then
                base_name="Assetto_Corsa_Rally_$base_name"
              fi
              
              dest_file="docs/Games/$game/${base_name}.md"
              
              echo "  → Processing: $filename"
              
              # Read and process file content
              content=$(cat "$inbox_file")
              
              # Convert h1 to h2 and add source attribution
              processed=$(python3 -c "
import sys
import re
content = '''$content'''
content = re.sub(r'^# ', '## ', content, flags=re.MULTILINE)
if '!!! info \"Источник\"' not in content:
    content = content.rstrip() + '\n\n!!! info \"Источник\"\n    Auto-processed from INBOX\n'
print(content)
")
              
              echo "$processed" > "$dest_file"
              echo "  → Saved to: $dest_file"
              
              # Delete from INBOX
              rm "$inbox_file"
              echo "  → Deleted from INBOX"
            else
              echo "  ⚠️  Skipping: $filename (unknown game type)"
            fi
          done

      - name: Validate MkDocs format
        run: mkdocs build --strict

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage all changes
          git add -A
          
          # Check if there are changes to commit
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Process INBOX: Auto-format and move files to Games"
            git push
            echo "✅ Changes committed and pushed"
          else
            echo "ℹ️  No changes to commit"
          fi
          fi
