name: Process INBOX Files

on:
  push:
    branches:
      - main
    paths:
      - 'docs/INBOX/**'
      - '.github/workflows/process-inbox.yml'

permissions:
  contents: write

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: pip install mkdocs mkdocs-material

      - name: Process INBOX files
        env:
          INBOX_PATH: docs/INBOX
          GAMES_PATH: docs/Games
        run: python3 << 'PROCESS_SCRIPT'
import os
import re
import sys
from pathlib import Path

inbox_dir = Path(os.getenv('INBOX_PATH', 'docs/INBOX'))
games_dir = Path(os.getenv('GAMES_PATH', 'docs/Games'))

# Find all markdown files in INBOX (except README)
inbox_files = [f for f in inbox_dir.glob('*.md') if f.name != 'README.md']

if not inbox_files:
    print("No files to process")
    sys.exit(0)

print(f"Processing {len(inbox_files)} files...")

for inbox_file in inbox_files:
    filename = inbox_file.name
    
    # Check if it's Assetto Corsa Rally content
    if any(keyword in filename for keyword in ['Assetto', 'Rally', 'Performance', 'VR']):
        base_name = filename[:-3]  # Remove .md
        
        # Add game prefix if not present
        if not base_name.startswith('Assetto'):
            base_name = f"Assetto_Corsa_Rally_{base_name}"
        
        game_dir = games_dir / 'Assetto Corsa Rally'
        game_dir.mkdir(parents=True, exist_ok=True)
        dest_file = game_dir / f"{base_name}.md"
        
        print(f"  Processing: {filename}")
        
        # Read file
        with open(inbox_file, 'r', encoding='utf-8') as f:
            content = f.read()
        
        # Convert h1 to h2
        content = re.sub(r'^# ', '## ', content, flags=re.MULTILINE)
        
        # Add source attribution if not present
        if '!!! info "Источник"' not in content:
            content = content.rstrip() + '\n\n!!! info "Источник"\n    Auto-processed from INBOX\n'
        
        # Write to destination
        with open(dest_file, 'w', encoding='utf-8') as f:
            f.write(content)
        
        print(f"  → Saved to: {dest_file}")
        
        # Delete from INBOX
        inbox_file.unlink()
        print(f"  → Deleted from INBOX")

print("✅ Processing complete")
PROCESS_SCRIPT

      - name: Validate MkDocs format
        run: mkdocs build --strict

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add -A
          
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Process INBOX: Auto-format and move files to Games"
            git push
          else
            echo "No changes to commit"
          fi
