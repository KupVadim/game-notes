name: Process INBOX Files

on:
  push:
    branches:
      - main
    paths:
      - 'docs/INBOX/**'
      - '.github/workflows/process-inbox.yml'

permissions:
  contents: write

jobs:
  process-inbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install MkDocs
        run: |
          pip install mkdocs mkdocs-material

      - name: Find INBOX files
        id: find_files
        run: |
          FILES=$(find docs/INBOX -type f -name '*.md' ! -name 'README.md' | sort)
          FILE_COUNT=$(echo "$FILES" | grep -c . || true)
          
          if [ $FILE_COUNT -gt 0 ]; then
            echo "has_files=true" >> $GITHUB_OUTPUT
            echo "$FILES" > /tmp/inbox_files.txt
            echo "Found $FILE_COUNT files to process"
            cat /tmp/inbox_files.txt
          else
            echo "has_files=false" >> $GITHUB_OUTPUT
            echo "No files in INBOX"
          fi

      - name: Process INBOX files
        if: steps.find_files.outputs.has_files == 'true'
        run: |
          # Function to detect game from filename
          detect_game() {
            filename=$1
            if [[ $filename == *"Assetto"* ]] || [[ $filename == *"Rally"* ]] || [[ $filename == *"Performance"* ]] || [[ $filename == *"VR"* ]]; then
              echo "Assetto Corsa Rally"
            else
              echo "Unknown"
            fi
          }
          
          # Create games directory structure if needed
          mkdir -p "docs/Games/Assetto Corsa Rally"
          
          # Process each file
          while IFS= read -r file; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              
              # Determine destination game
              game=$(detect_game "$filename")
              
              if [ "$game" = "Unknown" ]; then
                echo "⚠️  Skipping $filename - cannot determine game category"
                continue
              fi
              
              # Standardize filename to CamelCase_with_underscores
              # Remove .md extension, apply naming convention
              base_name="${filename%.md}"
              
              # Ensure it starts with game name or is properly formatted
              if [[ ! $base_name == *"_"* ]]; then
                base_name="${game// /_}_${base_name}"
              fi
              
              dest_file="docs/Games/$game/${base_name}.md"
              
              echo "Processing: $filename → $dest_file"
              
              # Read file content
              content=$(cat "$file")
              
              # Format with MkDocs features
              formatted_content=$(python3 << 'PYEOF'
import sys
content = sys.stdin.read()

# Ensure no # (h1) headers at top
lines = content.split('\n')
formatted_lines = []
skip_first_h1 = True

for line in lines:
    if skip_first_h1 and line.startswith('# '):
        formatted_lines.append(line.replace('# ', '## ', 1))
        skip_first_h1 = False
    else:
        formatted_lines.append(line)

formatted_content = '\n'.join(formatted_lines)

# Add source attribution if not present
if '!!! info "Источник"' not in formatted_content:
    formatted_content = formatted_content.rstrip() + '\n\n!!! info "Источник"\n    Original source: See copilot-instructions.md\n'

sys.stdout.write(formatted_content)
PYEOF
              )
              
              # Write to destination
              echo "$formatted_content" > "$dest_file"
              echo "✅ Moved to: $dest_file"
            fi
          done < /tmp/inbox_files.txt

      - name: Validate MkDocs format
        if: steps.find_files.outputs.has_files == 'true'
        run: |
          mkdocs build --strict 2>&1 | tee build.log
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "✅ MkDocs validation passed"
          else
            echo "❌ MkDocs validation failed"
            exit 1
          fi

      - name: Commit and push
        if: steps.find_files.outputs.has_files == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage changes
          git add docs/Games/
          git rm docs/INBOX/*.md --ignore-unmatch || true
          
          # Check if there are changes
          if git diff-index --quiet HEAD --; then
            echo "No changes to commit"
          else
            # Get list of processed files for commit message
            FILES=$(git diff --cached --name-only | grep -E '(Games|INBOX)' | tr '\n' ', ' | sed 's/,$//')
            git commit -m "Process INBOX: Auto-format and move files to Games"
            git push
            echo "✅ Changes committed and pushed"
          fi
          fi
